# Pemicu terjadwal untuk deployment Vercel.
#
# Latar belakang: Vercel Hobby hanya mengizinkan cron sekali sehari, dan
# MENOLAK jadwal sub-daily saat deploy (build gagal). Jadi jadwal 6 jam
# dipindahkan ke GitHub Actions yang gratis, sementara `vercel.json` hanya
# memuat satu cron harian.
#
# Rahasia yang dibutuhkan (Settings -> Secrets and variables -> Actions):
#   API_BASE_URL  = https://<project>.vercel.app   (TANPA /api)
#   CRON_SECRET   = sama dengan yang ada di Vercel
#
# Satu job per liga, bukan satu job yang menggilir semuanya, karena:
#  - tiap panggilan bisa selesai jauh di bawah batas 60 detik Vercel
#  - kegagalan satu liga tidak menggagalkan liga lain (fail-fast: false)

name: odds-sync

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: odds-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        league:
          - england-premier-league
          - england-championship
          - spain-laliga
          - italy-serie-a
          - france-ligue-1
          - netherlands-eredivisie
          - germany-bundesliga
    steps:
      - name: Sync ${{ matrix.league }}
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_BASE_URL atau CRON_SECRET belum diisi di repository secrets."
            exit 1
          fi
          curl -fsS --max-time 55 \
            "$API_BASE_URL/api/cron?token=$CRON_SECRET&action=sync&league=${{ matrix.league }}"
          echo ""
          echo "OK: ${{ matrix.league }}"

  # Settlement outcome cukup sekali sehari; hasil pertandingan tidak berubah
  # dalam hitungan jam.
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sync
    if: always()
    steps:
      - name: Isi outcome prediction_selections
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_BASE_URL atau CRON_SECRET belum diisi di repository secrets."
            exit 1
          fi
          curl -fsS --max-time 55 \
            "$API_BASE_URL/api/cron?token=$CRON_SECRET&action=outcomes"
          echo ""

# CATATAN soal closing-odds
# -------------------------
# `?action=closing` perlu dipanggil sekitar T-10 menit sebelum kick-off. GitHub
# Actions tidak cocok untuk itu: jadwal minimumnya 5 menit tetapi sering
# terlambat beberapa menit di bawah beban. Kalau CLV ingin akurat, pakai
# cron-job.org (gratis, bisa per menit) yang memanggil:
#
#   https://<project>.vercel.app/api/cron?token=<CRON_SECRET>&action=closing
#
# Job itu murah dan tidak memakai kuota odds: ia hanya membaca
# odds_movement_history yang sudah tersimpan.
