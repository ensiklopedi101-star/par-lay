# Pemicu terjadwal untuk deployment Vercel.
#
# ─── Kenapa file ini ada di AKAR repo ──────────────────────────────────────
# Versi sebelumnya disimpan di `Parlay-Analyzer-System/.github/workflows/`,
# yaitu subfolder. GitHub HANYA membaca `.github/workflows` di akar repositori,
# sehingga workflow itu tidak pernah terdaftar: `gh workflow list` kosong dan
# `GET /actions/workflows/odds-sync.yml` menjawab 404. Tidak ada satu pun jadwal
# 6 jam yang pernah berjalan sejak file itu dibuat.
#
# ─── Kenapa dipecah per liga ──────────────────────────────────────────────
# Vercel Hobby memotong fungsi di 60 detik (`vercel.json` → maxDuration).
# Menyapu tujuh liga dalam satu panggilan tidak muat. Satu job per liga membuat
# tiap panggilan pendek, dan kegagalan satu liga tidak menggagalkan liga lain.
#
# ─── Kenapa tiap jam, 7 liga, ?max=10 ─────────────────────────────────────
# Kuota Odds-API free plan 100 permintaan/jam; satu event = satu permintaan
# odds. 7 liga x 10 event = 70 permintaan + 7 daftar event = 77/jam, aman di
# bawah kuota.
#
# Jadwal lama 6 jam membuat cakupan mustahil: 151 fixture dalam 20 hari,
# sementara satu run hanya menyegarkan 70 event. Hasil audit 12 Nov 2026:
# 71 dari 151 fixture belum pernah punya baris odds sama sekali, dan karena
# batas "odds terverifikasi" adalah 3 jam (MAX_VERIFIED_ODDS_AGE_MS), selama
# ~3 jam di setiap siklus 6 jam SEMUA fixture terlihat stale sehingga scanner
# menolak memanggil AI tanpa alasan yang benar.
#
# Jam 06:00 UTC dilewati karena pada jam itu cron harian Vercel
# (`vercel.json` → action=daily) sudah menyinkronkan semua liga; menjalankan
# keduanya bersamaan akan melewati kuota.
#
# Matriks liga harus sama dengan `scheduler_config.leagues`.
#
# Rahasia yang dibutuhkan (Settings → Secrets and variables → Actions):
#   API_BASE_URL = https://<project>.vercel.app   (TANPA /api)
#   CRON_SECRET  = sama dengan yang ada di Vercel
#
# Kegagalan kini dilaporkan lewat anotasi berisi kode HTTP (401 = token beda,
# 404 = API_BASE_URL salah/berakhiran /api, 000 = tidak bisa menghubungi host),
# karena log mentah tidak selalu bisa dibaca dari CLI.

name: odds-sync

# PEMICU UTAMA BUKAN FILE INI. Sejak 13 Nov 2026 pemilik memakai cron-job.org
# sebagai pemicu terjadwal (lihat Parlay-Analyzer-System/CRON_JOBS.md).
# Jadwal GitHub di file ini DIMATIKAN karena:
#   1. Setiap run terjadwal gagal (secrets Actions tidak diisi) — noise.
#   2. Bila secrets suatu saat diisi, ia akan menabrak job cron-job.org dan
#      membakar kuota Odds-API dua kali untuk pekerjaan yang sama.
# File ini dipertahankan hanya sebagai pemicu MANUAL (workflow_dispatch)
# untuk keadaan darurat, misalnya cron-job.org sedang down.
on:
  workflow_dispatch: {}

concurrency:
  group: odds-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        league:
          - england-premier-league
          - england-championship
          - spain-laliga
          - italy-serie-a
          - germany-bundesliga
          - france-ligue-1
          - netherlands-eredivisie
    steps:
      - name: Sync ${{ matrix.league }}
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secrets API_BASE_URL / CRON_SECRET belum diisi."
            exit 1
          fi
          if printf '%s' "$API_BASE_URL" | grep -qE '/api/?$'; then
            echo "::error::API_BASE_URL tidak boleh berakhiran /api — workflow menambahkan /api/cron sendiri."
            exit 1
          fi
          URL="$API_BASE_URL/api/cron?token=$CRON_SECRET&action=sync&league=${{ matrix.league }}&max=10"
          code=$(curl -sS --max-time 55 -o /tmp/body.txt -w '%{http_code}' "$URL" 2>/tmp/curl.err || true)
          BODY=$(head -c 300 /tmp/body.txt 2>/dev/null | tr '\n' ' ')
          echo "HTTP ${code:-000} — sync"
          echo "$BODY"
          if [ "$code" != "200" ]; then
            ERR=$(head -c 160 /tmp/curl.err 2>/dev/null | tr '\n' ' ')
            echo "::error::sync gagal: HTTP ${code:-000} ${ERR} ${BODY}"
            exit 1
          fi

  # Analisis AI ikut tiap jam. Panggilan ini idempoten: fixture yang sudah punya
  # prediksi dilewati, jadi tambahan biaya hanya terjadi saat ada fixture baru.
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sync
    if: always()
    steps:
      - name: Analisis fixture akan datang
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secrets API_BASE_URL / CRON_SECRET belum diisi."
            exit 1
          fi
          if printf '%s' "$API_BASE_URL" | grep -qE '/api/?$'; then
            echo "::error::API_BASE_URL tidak boleh berakhiran /api — workflow menambahkan /api/cron sendiri."
            exit 1
          fi
          URL="$API_BASE_URL/api/cron?token=$CRON_SECRET&action=analyze"
          code=$(curl -sS --max-time 55 -o /tmp/body.txt -w '%{http_code}' "$URL" 2>/tmp/curl.err || true)
          BODY=$(head -c 300 /tmp/body.txt 2>/dev/null | tr '\n' ' ')
          echo "HTTP ${code:-000} — analyze"
          echo "$BODY"
          if [ "$code" != "200" ]; then
            ERR=$(head -c 160 /tmp/curl.err 2>/dev/null | tr '\n' ' ')
            echo "::error::analyze gagal: HTTP ${code:-000} ${ERR} ${BODY}"
            exit 1
          fi

  # Outcome ledger cukup sekali sehari; hasil pertandingan tidak berubah
  # dalam hitungan jam.
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: analyze
    if: always()
    steps:
      - name: Isi outcome prediction_selections
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secrets API_BASE_URL / CRON_SECRET belum diisi."
            exit 1
          fi
          if printf '%s' "$API_BASE_URL" | grep -qE '/api/?$'; then
            echo "::error::API_BASE_URL tidak boleh berakhiran /api — workflow menambahkan /api/cron sendiri."
            exit 1
          fi
          URL="$API_BASE_URL/api/cron?token=$CRON_SECRET&action=outcomes"
          code=$(curl -sS --max-time 55 -o /tmp/body.txt -w '%{http_code}' "$URL" 2>/tmp/curl.err || true)
          BODY=$(head -c 300 /tmp/body.txt 2>/dev/null | tr '\n' ' ')
          echo "HTTP ${code:-000} — outcomes"
          echo "$BODY"
          if [ "$code" != "200" ]; then
            ERR=$(head -c 160 /tmp/curl.err 2>/dev/null | tr '\n' ' ')
            echo "::error::outcomes gagal: HTTP ${code:-000} ${ERR} ${BODY}"
            exit 1
          fi

# CATATAN soal closing-odds
# -------------------------
# `?action=closing` perlu dipanggil sekitar T-10 menit sebelum kick-off.
# GitHub Actions tidak cocok: jadwal minimumnya 5 menit tetapi sering terlambat
# beberapa menit di bawah beban. Pakai cron-job.org (gratis, per menit) untuk:
#
#   https://<project>.vercel.app/api/cron?token=<CRON_SECRET>&action=closing
#
# Job itu murah dan tidak memakai kuota odds: hanya membaca
# `odds_movement_history` yang sudah tersimpan.
